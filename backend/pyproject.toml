[project]
name = "lifeos"
version = "0.1.0"
description = "LifeOS — local-first personal productivity & life-balance system (backend)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "pydantic>=2.9",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "tzdata>=2024.1",  # timezone database for Windows collectors
]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lifeos"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
lifeos = "lifeos.main:run"
lifeos-collect = "lifeos.collector:main"
